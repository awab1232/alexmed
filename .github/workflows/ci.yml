name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: the job only checks out, installs, typechecks and tests.
# Actions are pinned to commit SHAs (tag in the comment) so a moved tag
# can't change what runs here.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type-only check — no DATABASE_URL/secrets needed, same as running it
      # locally: schema.ts and every getDb()-backed module compile without a
      # live connection.
      - name: Typecheck
        run: pnpm run check

      # Reads/writes throughout lib/db-*.ts return safe defaults when
      # getDb() finds no DATABASE_URL, so the full suite runs green with zero
      # secrets configured — never point this at the real (production)
      # Supabase database.
      - name: Test
        run: pnpm test
