services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the STORAGE_BUCKET (must match .env's STORAGE_BUCKET) on
  # first run, since MinIO doesn't auto-create buckets. Exits once done;
  # `docker compose up -d` leaves it stopped/exited, which is expected.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/alexmed
      "

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  minio-data:
